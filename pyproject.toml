[project]
name = "lijnpy"
version = "1.0.0"
description = ""
readme = "README.md"
license = "MIT"
authors = [{ name = "Ilias Bachiri", email = "ilias.bachiri@gmail.com" }]
requires-python = ">=3.12"
dependencies = [
    "requests>=2.31.0,<3",
    "pydantic>=2.6.3,<3",
    "pydantic-extra-types>=2.6.0,<3",
    "aiohttp>=3.9.5,<4",
]

[dependency-groups]
dev = [
    "pytest>=8.0.2",
    "coverage>=7.4.3",
]
# only used in github actions
github-actions = [
    "pytest-github-actions-annotate-failures>=0.1.7",
]
docs = [
    "pdoc>=16.0.0",
]

[tool.pytest.ini_options]
# Tests marked "live" call the real API; run them with `pytest -m live`.
addopts = "-m 'not live'"
markers = ["live: calls the real De Lijn API (needs DELIJN_API_KEY)"]

[tool.coverage.run]
relative_files = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
