[project]
name = "lijnpy"
version = "3.0.0"
description = "Asynchronous Python wrapper for the De Lijn open data API"
readme = "README.md"
license = "MIT"
authors = [{ name = "Ilias Bachiri", email = "ilias.bachiri@gmail.com" }]
requires-python = ">=3.12"
keywords = ["de lijn", "delijn", "belgium", "flanders", "public transport", "api", "asyncio"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]
dependencies = [
    "pydantic>=2.6.3,<3",
    "pydantic-extra-types>=2.6.0,<3",
    "aiohttp>=3.9.5,<4",
]

[project.urls]
Documentation = "https://iliasib.github.io/lijnpy/lijnpy.html"
Source = "https://github.com/IliasIB/lijnpy"
Issues = "https://github.com/IliasIB/lijnpy/issues"
Changelog = "https://github.com/IliasIB/lijnpy/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "pytest>=8.0.2",
    "coverage>=7.4.3",
]
# only used in github actions
github-actions = [
    "pytest-github-actions-annotate-failures>=0.1.7",
]
docs = [
    "pdoc>=16.0.0",
]

[tool.pytest.ini_options]
# Tests marked "live" call the real API; run them with `pytest -m live`.
addopts = "-m 'not live'"
markers = ["live: calls the real De Lijn API (needs DELIJN_API_KEY)"]

[tool.coverage.run]
source = ["lijnpy"]

[tool.coverage.report]
# `coverage report` exits non-zero below this, which fails CI
fail_under = 95
show_missing = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
