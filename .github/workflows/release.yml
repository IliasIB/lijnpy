name: Release

on:
  push:
    tags:
      - '*.*.*'

jobs:
  ci:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract release notes from the CHANGELOG
        env:
          TAG: ${{ github.ref_name }}
        run: .github/scripts/release_notes.sh "$TAG" > release-notes.md

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.8"
          enable-cache: true

      - name: Build project for distribution
        run: uv build

      - name: Check Version
        id: check-version
        run: |
          [[ "$(uv version --short)" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || echo prerelease=true >> $GITHUB_OUTPUT

      - name: Create Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: "dist/*"
          bodyFile: release-notes.md
          token: ${{ secrets.GITHUB_TOKEN }}
          draft: false
          prerelease: steps.check-version.outputs.prerelease == 'true'

      - name: Publish to PyPI
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_TOKEN }}
        run: uv publish