name: Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - "**"

jobs:
  ci:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.8"
          enable-cache: true

      - name: Check lock file
        run: uv lock --check

      - name: Install dependencies
        run: uv sync --group github-actions

      - name: Run tests with coverage
        run: uv run coverage run -m pytest

      - name: Show coverage in the job summary
        run: uv run coverage report --fail-under=0 --format=markdown >> "$GITHUB_STEP_SUMMARY"

      - name: Check the coverage threshold
        run: uv run coverage report
