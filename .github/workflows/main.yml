name: Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - "**"

jobs:
  ci:
    name: Tests (Python ${{ matrix.python }}, ${{ matrix.resolution }} dependencies)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14", "3.15"]
        resolution: [highest]
        include:
          # The oldest versions the dependency ranges in pyproject.toml allow.
          # Python 3.12 is the only version they all have wheels for.
          - python: "3.12"
            resolution: lowest-direct
            sync-args: --resolution lowest-direct
    env:
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.8"
          enable-cache: true

      - name: Check lock file
        run: uv lock --check

      - name: Install dependencies
        # sync-args is empty (use the lock file) except for the lowest-versions job
        run: uv sync --group github-actions ${{ matrix.sync-args }}

      - name: Run tests with coverage
        run: uv run --no-sync coverage run -m pytest

      - name: Show coverage in the job summary
        run: uv run --no-sync coverage report --fail-under=0 --format=markdown >> "$GITHUB_STEP_SUMMARY"

      - name: Check the coverage threshold
        run: uv run --no-sync coverage report
