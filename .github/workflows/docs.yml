name: Documentation

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

jobs:
  update-docs:
    name: Update docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.8"
          enable-cache: true

      - name: Check lock file
        run: uv lock --check

      - name: Install dependencies
        run: uv sync --group docs

      - name: Setup git
        run: |
          git config --global user.email "github-actions@github.com"
          git config --global user.name "github-actions"

      - name: Reset branch to main
        run: |
          git fetch origin main:main
          git reset --hard main
          git rebase main

      - name: Build docs
        run: |
          uv run handsdown --external `git config --get remote.origin.url` --create-configs

      - name: Commit docs
        run: |
          git add docs
          git commit -m "Update docs"
          git push -f
